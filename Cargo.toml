[package]
name = "bevyrpg"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
bevy_debug_stepping = []

[dependencies]
anyhow = "1.0.100"
bevy = { version = "0.19.0", default-features = false, features = [
  "std",
  #"trace",
  "async_executor",
  "android-game-activity",
  #"android_shared_stdcxx",
  "gltf_animation",
  "bevy_asset",
  "bevy_color",
  "bevy_core_pipeline",
  "bevy_dev_tools",
  "bevy_post_process",
  "bevy_anti_alias",
  "bevy_gilrs",
  "bevy_gizmos",
  "bevy_gltf",
  "bevy_input_focus",
  "bevy_log",
  "mesh_picking",
  "bevy_pbr",
  "bevy_picking",
  "bevy_render",
  "bevy_scene",
  "bevy_image",
  "bevy_feathers",
  "bevy_mesh",
  "bevy_camera",
  "bevy_light",
  "bevy_shader",
  "bevy_sprite",
  "sprite_picking",
  "bevy_sprite_render",
  "bevy_state",
  "bevy_text",
  "bevy_ui",
  "ui_picking",
  "bevy_ui_render",
  "bevy_window",
  "bevy_winit",
  "custom_cursor",
  "default_font",
  "hdr",
  "ktx2",
  "multi_threaded",
  "png",
  "reflect_auto_register",
  "smaa_luts",
  "sysinfo_plugin",
  "tonemapping_luts",
  "webgl2",
  "x11",
  "wayland",
  "debug",
  "zstd_rust",
  "jpeg",
  "serialize",
  "bevy_debug_stepping"
] }
clap = { version = "*", features = ["derive"] }
lazy_static = "*"
rand = "*"
serde = "*"
standard-dist = "*"
nom = "*"

polyanya = "0.16.1"
itertools = "0.14.0"
tracing = "0.1.44"
ratatui = { version = "0.30.0", default-features = false }

