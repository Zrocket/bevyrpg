bevy_common_assets = { version = "0.17.0", features = ["ron"] }
moonshine-save = "0.7.0"
chill_bevy_console = "0.3.0"
bevy-yoleck = "0.33.0"
bevy_egui = "0.42.0"
bevy_simple_text_input = "0.15.0"
bevy-inspector-egui = "0.37.0"
bevy_enhanced_input = "0.26.0"
bevy_hanabi = "0.19.0"
bevy_sprite3d = "9.0.0"
bevy_flycam = "0.19.0"
bevy_skein = "0.6.0"
bevy-tnua = "0.32.0"
bevy-tnua-physics-integration-layer = "0.13.0"
bevy-tnua-avian3d = "0.12.0"
bevy_yarnspinner = "0.9.0"
bevy_yarnspinner_example_dialogue_view = "0.9.0"
avian3d = { version = "0.7.0", features = ["collider-from-mesh"] }
avian_pickup = "0.6.0"
bevy_asset_loader = {version = "0.27.0", features = ["2d", "standard_dynamic_assets"]}
bevy_console = "0.18.0"
landmass = "0.9.2"
bevy_landmass = "0.12.0"
landmass_rerecast = "0.3.0"
avian_rerecast = "0.6.0"
bevy_rerecast = "0.5.0"
bevy_seedling = "0.8.0"
bevy_ingame_clock = { git = "https://github.com/GuillaumeDelorme/bevy_ingame_clock.git", branch = "bevy-0.19-update" }

[profile.dev]
opt-level=3

